<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Laeser favicon</title>
  <desc id="desc">A bold white letter L with teal RSS feed arcs on a deep navy rounded square background.</desc>
  <rect width="1024" height="1024" rx="150" fill="#062b5f"/>
  <!-- Stylized L -->
  <path d="M250 210 H390 V655 H835 V790 H250 Z" fill="#ffffff"/>
  <!-- RSS dot -->
  <circle cx="472" cy="570" r="43" fill="#2fc3b7"/>
  <!-- RSS arcs -->
  <path d="M430 390 A270 270 0 0 1 700 660" fill="none" stroke="#2fc3b7" stroke-width="68" stroke-linecap="butt"/>
  <path d="M430 240 A420 420 0 0 1 850 660" fill="none" stroke="#2fc3b7" stroke-width="68" stroke-linecap="butt"/>
</svg>
